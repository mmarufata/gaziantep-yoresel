<!-- templates/admin_panel.html -->
<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <title>Yönetim Paneli</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen p-8">
  <div class="max-w-4xl mx-auto bg-white p-8 rounded-2xl shadow-lg">
    <h1 class="text-3xl font-bold text-center mb-6 text-indigo-700">Yönetim Paneli</h1>
    
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        {% for category, message in messages %}
          <div class="mb-4 p-3 rounded-lg {% if category == 'success' %}bg-green-100 text-green-700{% elif category == 'danger' %}bg-red-100 text-red-700{% else %}bg-blue-100 text-blue-700{% endif %}">
            {{ message }}
          </div>
        {% endfor %}
      {% endif %}
    {% endwith %}
    
    <div class="flex justify-center gap-4">
      <a href="{{ url_for('add_product') }}" class="bg-green-500 text-white px-6 py-3 rounded-lg hover:bg-green-600">Ürün Ekle</a>
      <a href="{{ url_for('manage_products') }}" class="bg-yellow-500 text-white px-6 py-3 rounded-lg hover:bg-yellow-600">Ürünleri Yönet</a>
      <a href="{{ url_for('admin_orders') }}" class="bg-blue-500 text-white px-6 py-3 rounded-lg hover:bg-blue-600">Siparişler</a>
      <a href="{{ url_for('admin_logout') }}" class="bg-red-500 text-white px-6 py-3 rounded-lg hover:bg-red-600">Çıkış Yap</a>
    </div>
    <!-- test için ekleniyor silinecek  -->
    <div class="mt-8 flex justify-center">
      <form method="POST" action="{{ url_for('admin_test_email') }}">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <button type="submit" class="bg-indigo-600 hover:bg-indigo-700 text-white px-6 py-3 rounded-lg font-semibold transition">📧 Test E-postası Gönder</button>
      </form>
    </div>
    <!-- burada bitiyor -->
  </div>
</body>
</html>
