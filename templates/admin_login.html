<!-- templates/admin_login.html -->
<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <title>Admin Girişi</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 flex items-center justify-center h-screen">
  <div class="bg-white p-8 rounded-2xl shadow-md w-96">
    <h1 class="text-2xl font-bold mb-6 text-center text-gray-700">Yönetici Girişi</h1>
    
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        {% for category, message in messages %}
          <div class="mb-4 p-3 rounded-lg {% if category == 'success' %}bg-green-100 text-green-700{% elif category == 'danger' %}bg-red-100 text-red-700{% else %}bg-blue-100 text-blue-700{% endif %}">
            {{ message }}
          </div>
        {% endfor %}
      {% endif %}
    {% endwith %}
    
    <form action="{{ url_for('admin_login') }}" method="POST">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <label class="block text-gray-600 text-sm mb-2">Kullanıcı Adı</label>
      <input type="text" name="username" class="w-full border rounded-lg px-3 py-2 mb-4 focus:outline-none focus:ring focus:ring-indigo-300" required>
      
      <label class="block text-gray-600 text-sm mb-2">Şifre</label>
      <input type="password" name="password" class="w-full border rounded-lg px-3 py-2 mb-6 focus:outline-none focus:ring focus:ring-indigo-300" required>
      
      <button type="submit" class="w-full bg-indigo-600 text-white py-2 rounded-lg hover:bg-indigo-700 transition">
        Giriş Yap
      </button>
    </form>
  </div>
</body>
</html>
