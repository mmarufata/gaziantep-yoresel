<!DOCTYPE html>
<html lang="tr">
<head>
  <link rel="icon" type="image/png" sizes="192x192" href="{{ url_for('static', filename='favicon.png') }}">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  {% include '_seo_head.html' %}
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50">
  {% include '_navbar.html' %}
  <main class="max-w-xl mx-auto px-4 py-16">
    <div class="bg-white shadow rounded-xl p-8 text-center">
      <h1 class="text-2xl font-bold text-red-700 mb-4">Ödeme Tamamlanamadı</h1>
      <p class="text-gray-600"> Ödeme işleminiz tamamlanamadı veya ödeme ekranından ayrıldınız.</p>
      <p class="mt-3 text-sm text-gray-500">
        Sipariş No:
        <strong>{{ order.order_number }}</strong>
      </p>
      <a href="{{ url_for('payment', public_token=order.public_token) }}" class="inline-block mt-6 px-6 py-3 bg-green-800 text-white rounded-lg hover:bg-green-900">
        Tekrar Ödeme Yap
      </a>
    </div>
  </main>
</body>
</html>
